name: Docs Validate

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-validate.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-validate.yml'

permissions:
  contents: read

concurrency:
  group: docs-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 文档基线门禁
        run: python3 docs/MusAI-docs.py --validate --baseline docs/.validation-baseline.json
